[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-nffmtl"
version = "0.3.1"
description = "Leakage-controlled NFF-MTL experiments on the Steam review data"
requires-python = ">=3.11"
# Minimum versions for installation; requirements.txt pins the exact tested versions.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "torch>=2.2",
  "implicit==0.7.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end synthetic run", "gpu: CUDA code paths (skipped without a GPU)"]
