# Tuning / model selection: Colab A100, full data, validation year only (test is refused).
# Paths assume Google Drive mounted at /content/drive. Freeze the chosen settings in final.yaml.
experiment:
  stage: tuning
  name: steam-nffmtl-64d
data:
  recommendations_csv: /content/drive/MyDrive/steamRS/recommendations.csv
  metadata_json: /content/drive/MyDrive/steamRS/games_metadata.json
  cache_dir: /content/drive/MyDrive/steamRS/cache_v1
  train_years: [2010, 2020]
  val_year: 2021
  test_year: 2022
  kcore: 5            # applied to training years only
  n_tags: 50          # vocabulary from training-catalog games only
  dedup: keep_last
  verify_source_hash: false   # true = re-hash raw files on every cache load
task:
  primary: positive                 # future positively reviewed games
  sensitivity_relevance: [interaction]  # any future review, reported separately
eval:
  ks: [10, 20]
  test_user_sample: null            # null = every eligible training-known user
  val_user_sample: 20000            # fixed seeded sample used for epoch selection
  user_batch_size: 256
  auc_rows: 500000                  # same observed test rows for every model
  sample_seed: 20260101
  fail_on_error: true
  head_share: 0.2
  short_lists: report               # users with < K candidates get shorter lists (counted)
train:
  seed: 0
  embedding_dim: 64
  hidden: [128, 64, 32]
  dropout: [0.3, 0.2]
  alpha: 0.5
  neg_ratio: 4
  batch_size_total: 4096
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  scheduler_t0: 2
  scheduler_tmult: 2
  max_epochs: 15
  patience: 3
  select_metric: ndcg@20
  pos_weight: auto
  reg_min_hours: 0.0
  item_chunk: 4096
  deterministic: true
baselines:
  random: {enabled: true}
  popularity: {enabled: true}
  tagknn: {enabled: true, k: 100}
  itemknn: {enabled: true, k: 100, shrink: 10.0}
  bpr: {enabled: true, factors: 64, learning_rate: 0.01, regularization: 0.01, iterations: 100}
  als: {enabled: true, factors: 64, regularization: 0.1, alpha: 1.0, iterations: 15}
  ease: {enabled: false, l2: 500.0, max_items: 40000, device: cuda, memory_fraction: 0.8}   # enable after `estimate`
  use_gpu: {enabled: false}
runs_dir: /content/drive/MyDrive/steamRS/runs_tuning
tuning:
  # Equal number of trials: with budget_policy 'equal' every tuned model gets exactly n_trials distinct
  # candidates (a smaller grid is an error before any trial runs). 'cap' would make n_trials an upper bound.
  # Equal trial counts are not equal compute time; one NFF-MTL trial is a full training run.
  n_trials: 8
  seed: 0
  metric: ndcg@20
  budget_policy: equal
  spaces:
    tagknn: {k: [10, 25, 50, 100, 150, 200, 300, 400]}                                   # 8
    itemknn: {k: [50, 100, 200, 400], shrink: [0.0, 10.0, 50.0, 100.0]}                  # 16
    bpr: {factors: [64], learning_rate: [0.005, 0.01, 0.05], regularization: [0.0001, 0.001, 0.01], iterations: [50, 100, 200]}  # 27
    als: {factors: [64], regularization: [0.01, 0.1, 1.0], alpha: [1.0, 5.0, 10.0, 40.0], iterations: [15]}                      # 12
    ease: {l2: [10.0, 50.0, 100.0, 250.0, 500.0, 1000.0, 2500.0, 5000.0]}                # 8
    nffmtl: {lr: [0.0005, 0.001, 0.002], weight_decay: [0.0, 0.000001, 0.00001], alpha: [0.1, 0.5, 1.0]}                         # 27
